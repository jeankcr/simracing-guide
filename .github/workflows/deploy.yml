name: Actualizar catálogo y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # todos los días, 09:00 UTC (03:00 en Costa Rica)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Si Intelec no responde, se conserva el último data/products.json guardado.
      - name: Descargar catálogo de Intelec
        continue-on-error: true
        run: python crawler/crawl.py

      - name: Generar datos del sitio
        run: python crawler/build.py

      - name: Guardar el catálogo actualizado
        if: github.event_name == 'schedule'
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || (git commit -m "Update catalog snapshot" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
